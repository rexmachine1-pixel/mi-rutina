<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Rutina Upper/Lower 4 días</title>
<meta name="description" content="Rutina Upper/Lower con modo focus, registro kg/lb, RIR, historial y temporizador.">
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Rutina" />
<style>
:root{
  --bg:#0f1115;--card:#1a1d24;--card2:#232732;--text:#e8eaed;--muted:#aab0b8;
  --accent:#5a90ff;--accent2:#2ecc71;--danger:#e74c3c;--warm:#ffb02e;--border:#2e3440;
  --radius:16px;--radius-sm:10px;
  --shadow:0 8px 30px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.04) inset;
  --shadow-sm:0 2px 12px rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--card2);border-radius:8px;border:2px solid var(--bg)}
header{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--border);padding:14px max(16px, env(safe-area-inset-left)) 14px max(16px, env(safe-area-inset-right));display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
header h1{font-size:clamp(15px,3.4vw,18px);margin:0;font-weight:700;letter-spacing:-.02em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--accent);color:#fff;padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:700;letter-spacing:.02em;box-shadow:0 2px 10px rgba(90,144,255,.35);white-space:nowrap;flex-shrink:0}
nav.tabs{display:flex;overflow-x:auto;gap:8px;padding:12px max(16px, env(safe-area-inset-left)) 12px max(16px, env(safe-area-inset-right));border-bottom:1px solid var(--border);background:rgba(15,17,21,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);position:sticky;top:56px;z-index:19;scrollbar-width:none;scroll-snap-type:x proximity}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:var(--card);color:var(--text);border:1px solid var(--border);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer;font-family:inherit;min-height:40px;scroll-snap-align:start;transition:all .2s ease;flex-shrink:0}
nav.tabs button:hover{border-color:#3a4150;background:#1f232e;transform:translateY(-1px)}
nav.tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(90,144,255,.35)}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.tabs button .opt-mark{color:var(--warm);margin-left:3px;font-weight:800}
nav.tabs button.active .opt-mark{color:#fff}
main{padding:clamp(12px,3vw,24px) clamp(16px,4vw,28px);max-width:960px;margin:0 auto;width:100%}
.session-title{margin:22px 0 8px;font-size:clamp(22px,5vw,30px);font-weight:800;letter-spacing:-.03em;line-height:1.15}
.session-meta{color:var(--muted);font-size:clamp(13.5px,2.5vw,15px);margin-bottom:18px;line-height:1.6;max-width:65ch}
.ex-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:clamp(16px,3vw,22px);margin-bottom:16px;box-shadow:var(--shadow-sm);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
@media (hover:hover) and (pointer:fine){.ex-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#3a4150}}
.ex-name{font-weight:700;font-size:clamp(15.5px,3.2vw,17px);margin:0;line-height:1.35;letter-spacing:-.01em}
.ex-num{color:var(--accent);font-weight:800;margin-right:8px;font-size:1.05em}
.ex-info{color:var(--muted);font-size:13.5px;margin-top:6px;line-height:1.5}
.ex-target{color:var(--accent);font-weight:600}
.warmup{background:linear-gradient(0deg,rgba(255,176,46,.12),rgba(255,176,46,.12)),var(--card);border:1px solid rgba(255,176,46,.35);border-radius:var(--radius-sm);padding:12px 14px;margin:12px 0;font-size:13.5px;line-height:1.6}
.warmup .lbl{color:var(--warm);font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;display:block;margin-bottom:4px}
.tempo{background:var(--card2);border-radius:var(--radius-sm);padding:12px 14px;margin:12px 0;font-size:13.5px;color:var(--text);line-height:1.6;border:1px solid var(--border)}
.tempo .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:600;display:block;margin-bottom:4px}
.note{font-size:13px;color:var(--muted);margin:10px 0 2px;font-style:italic;line-height:1.6}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.form-row label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:6px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.form-row input,.form-row select,.form-row textarea{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:12px 14px;font-size:15px;font-family:inherit;min-height:46px;transition:border-color .18s ease,box-shadow .18s ease,background .18s ease}
.form-row textarea{min-height:80px;resize:vertical}
.form-row input::placeholder,.form-row textarea::placeholder{color:#6b7280}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(90,144,255,.18);background:#252a36}
.kg-equiv{color:var(--muted);font-size:12px;margin-top:6px;min-height:14px;font-weight:500}
.btn-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
button{cursor:pointer;font-family:inherit;background:var(--accent);color:#fff;border:none;padding:12px 18px;border-radius:var(--radius-sm);font-size:14px;font-weight:700;min-height:44px;transition:transform .12s ease,filter .18s ease,box-shadow .18s ease,background .18s ease,border-color .18s ease;letter-spacing:.01em}
button:hover{filter:brightness(1.08)}
button:active{transform:scale(.97)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border);box-shadow:none}
button.secondary:hover{background:#2a303e;border-color:#3a4150}
button.green{background:var(--accent2);box-shadow:0 4px 14px rgba(46,204,113,.25)}
button.danger{background:var(--danger);box-shadow:0 4px 14px rgba(231,76,60,.25)}
button:disabled{opacity:.4;cursor:not-allowed;filter:none}
.history-table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;margin-top:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.history-table th,.history-table td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.history-table th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;background:var(--card2);position:sticky;top:0}
.history-table tr:last-child td{border-bottom:none}
.history-table tr:hover td{background:rgba(255,255,255,.02)}
.empty{color:var(--muted);font-size:13px;padding:14px 0;font-style:italic;line-height:1.6}
details{margin-top:12px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:10px;padding:2px 12px}
details summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:700;padding:10px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
details[open]{padding-bottom:10px}
details[open] summary{margin-bottom:6px;border-bottom:1px solid var(--border)}
#timer{position:fixed;bottom:max(16px, env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:rgba(35,39,50,.92);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border:1px solid var(--accent);border-radius:20px;padding:16px 18px;display:none;align-items:center;gap:16px;box-shadow:0 12px 40px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.05) inset;z-index:100;width:min(92vw,420px);min-width:min(92vw,300px)}
#timer.show{display:flex}
#timer .time{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;min-width:96px;letter-spacing:-.02em;line-height:1}
#timer .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;font-weight:700;margin-bottom:4px}
#timer button{padding:8px 12px;font-size:12.5px;min-height:36px;border-radius:8px}
#timer.done{border-color:var(--danger);animation:pulse .9s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:translateX(-50%) scale(1)}50%{opacity:.85;transform:translateX(-50%) scale(1.02)}}
.info-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:clamp(16px,3vw,22px);margin-bottom:16px;font-size:14px;line-height:1.75;box-shadow:var(--shadow-sm)}
.info-box h3{margin:0 0 10px;font-size:15px;color:var(--accent);font-weight:800;letter-spacing:-.01em}
.info-box ul{margin:8px 0;padding-left:20px}
.info-box li{margin-bottom:6px}
.info-box li::marker{color:var(--muted)}
.info-box code{background:var(--card2);padding:3px 8px;border-radius:6px;font-size:12.5px;border:1px solid var(--border)}
.last-entry{background:rgba(90,144,255,.11);border:1px solid rgba(90,144,255,.35);border-radius:var(--radius-sm);padding:12px 14px;margin-top:12px;font-size:13px;line-height:1.5}
.last-entry b{color:var(--accent);font-weight:700}
.complete-btn{width:100%;padding:16px;font-size:16px;margin-top:20px;border-radius:12px;min-height:52px;letter-spacing:.01em}
.session-note-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:20px;box-shadow:var(--shadow-sm)}
.session-note-box label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:8px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.session-note-box textarea{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:12px 14px;font-size:15px;font-family:inherit;min-height:70px;resize:vertical}
.session-note-box textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(90,144,255,.18)}
.focus-cta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(90deg,rgba(90,144,255,.14),rgba(90,144,255,.04));border:1px solid rgba(90,144,255,.4);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px}
.focus-cta .cta-text{flex:1;min-width:180px}
.focus-cta .cta-text b{display:block;font-size:14.5px;margin-bottom:2px}
.focus-cta .cta-text span{font-size:13px;color:var(--muted);line-height:1.5}
.focus-cta button{flex-shrink:0}
.focus-bar{position:sticky;top:calc(56px + 1px);z-index:15;background:rgba(15,17,21,.95);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--border);padding:10px 0;margin:-24px -28px 20px;padding-left:clamp(16px,4vw,28px);padding-right:clamp(16px,4vw,28px);display:flex;align-items:center;gap:12px}
.focus-progress{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;min-width:80px}
.focus-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),#7aa5ff);transition:width .3s ease}
.focus-counter{font-size:13px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.focus-nav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;margin-bottom:8px}
.focus-nav button{padding:16px;font-size:15px;min-height:52px;font-weight:700}
.focus-session-title{font-size:13px;color:var(--muted);margin-bottom:14px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
@media (max-width:640px){
  header{padding-left:16px;padding-right:16px}
  nav.tabs{top:56px;padding:10px 12px;gap:6px}
  nav.tabs button{padding:10px 14px;font-size:13.5px;min-height:38px}
  main{padding:14px 14px 20px}
  .ex-card{padding:16px;border-radius:14px}
  .form-row{gap:10px}
  .form-row input,.form-row select,.form-row textarea{padding:12px 12px;font-size:16px}
  .history-table{font-size:12.5px;display:block;overflow-x:auto;white-space:nowrap;border-radius:12px}
  .history-table th,.history-table td{white-space:nowrap}
  #timer{width:94vw;padding:14px;bottom:max(12px, env(safe-area-inset-bottom));gap:12px}
  #timer .time{font-size:30px;min-width:84px}
  .focus-bar{top:calc(56px + 1px);margin:-14px -14px 14px;padding-left:14px;padding-right:14px}
  .focus-nav{gap:10px}
}
@media (max-width:480px){.btn-row{flex-direction:column}.btn-row button{width:100%;justify-content:center}.focus-nav{grid-template-columns:1fr}}
@media (max-width:380px){.form-row{grid-template-columns:1fr}header h1{font-size:14px}.badge{padding:5px 10px;font-size:11.5px}}
@media (min-width:768px){
  body{font-size:16.5px}
  header{padding:16px 28px;min-height:60px}
  nav.tabs{top:60px;padding:12px 28px;justify-content:flex-start;overflow:visible;flex-wrap:wrap}
  main{padding:24px 28px 32px}
  .ex-card{padding:22px}
  .form-row{gap:14px}
  .form-row input,.form-row select,.form-row textarea{min-height:48px}
  .history-table th,.history-table td{padding:12px 14px}
  .focus-bar{top:calc(60px + 1px);margin:-24px -28px 24px;padding-left:28px;padding-right:28px}
}
@media (min-width:1024px){main{max-width:980px}.session-title{font-size:32px;margin-top:28px}.ex-card{border-radius:18px}.info-box{padding:24px}#timer{width:420px}}
@media (min-width:1280px){main{max-width:1024px}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:rgba(90,144,255,.35)}
input[type="number"]{appearance:textfield;-moz-appearance:textfield}
input[type="number"]::-webkit-outer-spin-button,input[type="number"]::-webkit-inner-spin-button{appearance:none;margin:0}
.history-table-wrapper{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;margin-top:12px}
.unit-toggle{display:flex;background:var(--card2);border:1px solid var(--border);border-radius:999px;padding:3px;gap:3px;flex-shrink:0}
.unit-toggle button{padding:6px 14px;min-height:32px;border-radius:999px;font-size:12.5px;font-weight:700;background:transparent;border:1px solid transparent;color:var(--muted);transition:all .18s ease}
.unit-toggle button.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 10px rgba(90,144,255,.35)}
.unit-toggle button:hover{color:var(--text)}
.header-actions{display:flex;align-items:center;gap:10px}
.unit-select{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:12px 10px;font-size:14px;font-weight:700;min-height:46px}
.form-row.four{grid-template-columns:1.2fr 0.7fr 0.6fr 0.6fr}
@media (max-width:640px){.form-row.four{grid-template-columns:1fr 0.8fr;gap:10px}}
@media (max-width:380px){.form-row.four{grid-template-columns:1fr 1fr}}
.execution-tip{background:linear-gradient(0deg,rgba(90,144,255,.08),rgba(90,144,255,.08)),var(--card);border:1px solid rgba(90,144,255,.22);border-left:3px solid var(--accent);border-radius:0 12px 12px 0;padding:12px 14px;margin:14px 0;font-size:13.5px;line-height:1.65;position:relative}
.execution-tip .lbl{color:var(--accent);font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;font-weight:800;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.execution-tip .lbl::before{content:"◆";font-size:8px}
.execution-tip b{color:#d6deff}
.execution-tip em{color:var(--muted);font-style:normal;font-weight:600}
.set-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--card2);margin-top:8px;font-size:13.5px}
.set-row span{flex:1}
.set-row.pending{opacity:.45}
.set-row.done{border-left:3px solid var(--accent2)}
.set-row.cur{border-left:3px solid var(--accent)}
button.sm{padding:4px 10px;min-height:34px;font-size:13px}
.ss-tag{font-size:13px;color:var(--warm);margin-top:8px}
.last-entry.good{border-color:rgba(46,204,113,.45);background:rgba(46,204,113,.1)}
.banner{border-color:rgba(255,176,46,.4);font-size:13.5px}
.banner.urgent{border-color:var(--danger)}
#toast{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));transform:translateX(-50%);background:var(--card2);border:1px solid var(--accent);border-radius:12px;padding:12px 16px;font-size:14px;z-index:200;max-width:92vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.optional-banner{background:linear-gradient(0deg,rgba(255,176,46,.08),rgba(255,176,46,.08)),var(--card);border:1px solid rgba(255,176,46,.4);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px;font-size:13.5px;line-height:1.55}
.optional-banner b{color:var(--warm)}
</style>
</head>
<body>
<header>
  <h1>Rutina Upper/Lower 4 días</h1>
  <div class="header-actions">
    <div class="unit-toggle" title="Cambiar visualización kg/lb"><button id="unitKg" onclick="setDisplayUnit('kg')" class="active">kg</button><button id="unitLb" onclick="setDisplayUnit('lb')">lb</button></div>
    <span class="badge" id="nextBadge">Siguiente: D1</span>
  </div>
</header>
<nav class="tabs" id="tabs">
  <button data-view="D1" class="active">D1</button>
  <button data-view="D2">D2</button>
  <button data-view="D3">D3</button>
  <button data-view="D4">D4</button>
  <button data-view="D5">D5<span class="opt-mark">*</span></button>
  <button data-view="hist">Historial</button>
  <button data-view="guide">Guía</button>
</nav>
<main id="app"></main>

<div id="timer">
  <div>
    <div class="label" id="timerLabel">Descanso</div>
    <div class="time" id="timerTime">0:00</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;">
    <div style="display:flex;gap:6px;">
      <button class="secondary" onclick="adjustTimer(-15)">−15s</button>
      <button class="secondary" onclick="adjustTimer(15)">+15s</button>
    </div>
    <div style="display:flex;gap:6px;">
      <button class="secondary" onclick="toggleTimer()" id="timerPause">Pausar</button>
      <button class="danger" onclick="closeTimer()">Cerrar</button>
    </div>
  </div>
</div>

<script>
const ROUTINE = {
  D1: {
    title: "Día 1 — Upper A (press plano + jalón)",
    meta: "Press horizontal y jalón vertical como compuestos principales; después hombros, tríceps y bíceps. Transición: 60–90 s.",
    exercises: [
      { id:"A3", name:"Press plano convergente en máquina", sets:4, reps:"8–12", rest:150,
        warmup:"2 series progresivas: ligera ×8–10 y media ×4–5. Sin fatiga.",
        tempo:"Excéntrica 3s · Pausa 1s abajo · Concéntrica 2s",
        note:"Ajusta el asiento para que los agarres queden a la altura media del pecho. Codos ligeramente metidos, no a 90°. Aprieta el pectoral al empujar.",
        executionTip:"Baja el asiento 1 punto de lo que crees para estirar más pecho. Muñecas neutras. Piensa en <em>juntar bíceps, no manos</em>. Codos a 30-45°. Haz 3/4 del recorrido: para a 5cm del bloqueo. Aprieta 1s al frente."},
      { id:"A4", name:"Jalón al pecho con agarre neutro", sets:3, reps:"8–12", rest:150,
        warmup:"1–2 series progresivas: ligera ×8–10 y media ×4–5 si hace falta.",
        tempo:"Excéntrica 3s · Concéntrica 2s · Contracción 1s abajo",
        note:"Torso estable, costillas controladas. Codos abajo sin balancearte ni arquear lumbar.",
        executionTip:"Pecho alto, 15° atrás, costillas abajo. Agarre neutro cerrado. Baja al esternón alto, no a barbilla. <b>Codos hacia costillas</b>, no atrás. Arriba deja que dorsal se estire 1s."},
      { id:"C5", name:"Press de hombros en máquina", sets:3, reps:"8–12", rest:120,
        warmup:"1 serie ligera ×8–10 si lo necesitas.",

const SS = { B9:'E11', C6:'D8', C8:'D10' };
const SS_REV = {}; Object.keys(SS).forEach(k=>SS_REV[SS[k]]=k);

const LB_TO_KG = 0.453592;
const KG_TO_LB = 2.20462;
const SESSION_ORDER = ['D1','D2','D3','D4'];

function readJSON(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw === null ? fallback : JSON.parse(raw); }
  catch (err) { return fallback; }
}
function readObject(key) {
  const value = readJSON(key, {});
  return value && typeof value === 'object' && !Array.isArray(value) ? value : {};
}
function weightKg(entry) {
  if (entry && Number.isFinite(Number(entry.kg))) return Number(entry.kg);
  if (entry && Number.isFinite(Number(entry.lbs))) return Number(entry.lbs) * LB_TO_KG;
  return 0;
}
function showRir(value) {
  return value !== '' && value !== null && value !== undefined ? String(value) : '—';
}
function getDisplayUnit(){ return (state && state.settings && state.settings.displayUnit) || 'kg'; }
function kgToLb(kg){ return kg * KG_TO_LB; }
function lbToKg(lb){ return lb * LB_TO_KG; }
function formatWeight(kg, unit){
  const u = unit || getDisplayUnit();
  if(u==='lb') return kgToLb(kg).toFixed(1) + ' lb';
  return kg.toFixed(1) + ' kg';
}
function formatWeightBoth(kg){
  const lb = kgToLb(kg);
  if(getDisplayUnit()==='lb') return lb.toFixed(1)+' lb <span style="color:var(--muted)">('+kg.toFixed(1)+' kg)</span>';
  return kg.toFixed(1)+' kg <span style="color:var(--muted)">('+lb.toFixed(1)+' lb)</span>';
}
function updateUnitToggleUI(){
  const u = getDisplayUnit();
  const bKg = document.getElementById('unitKg');
  const bLb = document.getElementById('unitLb');
  if(bKg) bKg.classList.toggle('active', u==='kg');
  if(bLb) bLb.classList.toggle('active', u==='lb');
}
function setDisplayUnit(u){
  if(u!=='kg' && u!=='lb') return;
  state.settings.displayUnit = u;
  if(!state.settings.inputUnit) state.settings.inputUnit = u;
  save(); updateUnitToggleUI();
  const currentView = document.querySelector('nav.tabs button.active')?.dataset.view || state.next;
  switchView(currentView);
}
function onWeightInputChange(exId){
  const wInput = document.getElementById('w-'+exId);
  const unitSel = document.getElementById('unit-'+exId);
  const equiv = document.getElementById('equiv-'+exId);
  if(!wInput || !unitSel || !equiv) return;
  const val = parseFloat(wInput.value);
  if(!Number.isFinite(val)){ equiv.textContent = ''; return; }
  const unit = unitSel.value;
  const kg = unit==='lb' ? lbToKg(val) : val;
  equiv.textContent = unit==='lb' ? '= ' + kg.toFixed(1) + ' kg' : '= ' + kgToLb(kg).toFixed(1) + ' lb';
}
function onUnitChange(exId, newUnit){
  if(newUnit !== 'kg' && newUnit !== 'lb') return;
  const wInput = document.getElementById('w-'+exId);
  const oldUnit = state.settings.inputUnit || 'kg';
  if(wInput && newUnit !== oldUnit){
    const v = parseFloat(wInput.value);
    if(Number.isFinite(v) && v > 0){
      wInput.value = newUnit === 'lb' ? (v * KG_TO_LB).toFixed(1) : (v * LB_TO_KG).toFixed(1);
    }
  }
  state.settings.inputUnit = newUnit;
  save();
  onWeightInputChange(exId);
}

const storedNext = localStorage.getItem('ff_next');
const state = {
  next: SESSION_ORDER.includes(storedNext) ? storedNext : 'D1',
  logs: readObject('ff_logs'),
  history: Array.isArray(readJSON('ff_history', [])) ? readJSON('ff_history', []) : [],
  settings: readObject('ff_settings')
};
Object.keys(state.logs).forEach(id => { if (!Array.isArray(state.logs[id])) state.logs[id] = []; });
if(!state.settings.displayUnit) state.settings.displayUnit = 'kg';
if(!state.settings.inputUnit) state.settings.inputUnit = 'kg';

// Migración v6 → v7
if(!state.settings.migratedTo7){
  const nextMap = { A:'D1', B:'D2', C:'D3', D:'D4', E:'D1' };
  if(nextMap[state.next]) state.next = nextMap[state.next];
  state.history.forEach(h => { if(['A','B','C','D','E'].includes(h.session)) h.session = h.session + ' (v6)'; });
  state.settings.migratedTo7 = true;
}
// Migración v7/v3 → v8: unificar IDs duplicados (G5→B5, F8→D8, F10→D10)
if(!state.settings.migratedTo8){
  const idMap = { G5:'B5', F8:'D8', F10:'D10' };
  Object.keys(idMap).forEach(oldId => {
    if(state.logs[oldId] && state.logs[oldId].length){

  html += '<div class="info-box"><h3>Series registradas por ejercicio</h3><select class="unit-select" onchange="histFilter=this.value;state.settings.histFilter=this.value;save();switchView(\'hist\')"><option value="">Todos los ejercicios</option>'+Object.keys(state.logs).sort().map(i=>{const x=findExercise(i);return '<option value="'+i+'"'+(histFilter===i?' selected':'')+'>'+i+' · '+(x?x.name:'(sin sesión actual)')+'</option>';}).join('')+'</select>';
  const ids = Object.keys(state.logs).sort().filter(i=>!histFilter||i===histFilter);
  if (ids.length === 0) html += '<div class="empty">Sin series registradas.</div>';
  else {
    ids.forEach(id => {
      const entries = state.logs[id];
      if(!entries || !entries.length) return;
      const ex = findExercise(id);
      html += '<div style="margin-top:14px"><b>' + id + ' · ' + (ex ? ex.name : '(ejercicio retirado)') + '</b>';
      html += '<div class="history-table-wrapper"><table class="history-table"><thead><tr><th>Fecha</th><th>Peso</th><th>Reps/s</th><th>RIR</th><th>Nota</th></tr></thead><tbody>';
      entries.slice().reverse().slice(0, 20).forEach(e => {
        html += '<tr><td>' + fmtDate(e.ts) + '</td><td>' + formatWeightBoth(weightKg(e)) + '</td><td>' + e.reps + '</td><td>' + showRir(e.rir) + '</td><td>' + escapeHtml(e.note || '') + '</td></tr>';
      });
      html += '</tbody></table></div></div>';
    });
  }
  html += '</div>';
  return html;
}
function findExercise(id) {
  for (const k in ROUTINE) {
    const found = ROUTINE[k].exercises.find(e => e.id === id);
    if (found) return found;
  }
  return null;
}

function exportData() {
  state.settings.lastExport = Date.now(); save();
  const blob = new Blob([JSON.stringify({next:state.next, logs:state.logs, history:state.history, settings:state.settings}, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'rutina_upper_lower_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function importData(ev) {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  if (!confirm('Importar datos desde archivo.\n\nLos datos se FUSIONARÁN con los existentes (no se pierde nada).\n\nSi quieres reemplazar todo, primero usa "Borrar todos los datos".\n\n¿Continuar?')) { ev.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data || typeof data !== 'object') throw new Error('JSON inválido');
      if (data.logs && typeof data.logs === 'object' && !Array.isArray(data.logs)) {
        Object.keys(data.logs).forEach(id => {
          if(!Array.isArray(data.logs[id])) return;
          const existing = state.logs[id] || [];
          const existingTs = new Set(existing.map(x=>x.ts));
          const incoming = data.logs[id].filter(x=>!existingTs.has(x.ts));
          state.logs[id] = existing.concat(incoming).sort((a,b)=>a.ts-b.ts);
        });
      }
      if (Array.isArray(data.history)) {
        const existingKey = new Set(state.history.map(h=>h.ts+'_'+h.session));
        const incoming = data.history.filter(h=>!existingKey.has(h.ts+'_'+h.session));
        state.history = state.history.concat(incoming).sort((a,b)=>a.ts-b.ts);
      }
      if (data.settings && typeof data.settings === 'object' && !Array.isArray(data.settings)) {
        const preserved = {
          sid: state.settings.sid,
          lastExport: state.settings.lastExport,
          deloadAt: state.settings.deloadAt,
          histFilter: state.settings.histFilter,
          focusMode: state.settings.focusMode,
          focusSession: state.settings.focusSession,
          focusIndex: state.settings.focusIndex,
          displayUnit: state.settings.displayUnit || data.settings.displayUnit || 'kg',
          inputUnit: state.settings.inputUnit || data.settings.inputUnit || 'kg',
        };
        const machineKeys = Object.keys(data.settings).filter(k => /^[A-Z]\d+$/.test(k));
        const merged = Object.assign({}, data.settings, preserved);
        machineKeys.forEach(k => { if(state.settings[k] !== undefined) merged[k] = state.settings[k]; });
        merged.migratedTo7 = true;
        merged.migratedTo8 = true;
        state.settings = merged;
      }
      if (SESSION_ORDER.includes(data.next)) state.next = data.next;
      else if (data.next === 'D5') state.next = 'D1';
      if(!state.settings.displayUnit) state.settings.displayUnit='kg';
      if(!state.settings.inputUnit) state.settings.inputUnit='kg';
      save();
      toast('Datos importados y fusionados.');
      switchView('hist');
    } catch(err) { toast('Archivo inválido o con estructura no reconocida.'); }
    ev.target.value = '';
  };
  reader.readAsText(file);
}
function resetCycle() {
  if (!confirm('¿Reiniciar ciclo a D1?')) return;
  state.next = 'D1'; state.settings.focusMode = false; save(); switchView('D1');
}
function clearAll() {
  if (!confirm('¿Borrar todos los datos? Esto no se puede deshacer.')) return;
  state.logs = {};
  state.history = [];
  state.settings = {displayUnit:'kg', inputUnit:'kg', migratedTo7:true, migratedTo8:true};
  state.next = 'D1';
  save();
  switchView('D1');
}

let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function beep() {
  try {
    const ctx = ensureAudio();
    const now = ctx.currentTime;
    [0, 0.28, 0.56].forEach(offset => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.35, now + offset);
      gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.22);
      osc.start(now + offset);
      osc.stop(now + offset + 0.22);
    });
  } catch(e) {}
}

let timer={end:0,rem:0,running:false,id:null,label:''};
let wake=null;
async function acquireWake(){
  try{
    if('wakeLock' in navigator && !wake && !document.hidden){
      wake=await navigator.wakeLock.request('screen');
      wake.addEventListener('release',()=>{wake=null;});
    }
  }catch(e){}
}
function showTimer(){document.getElementById('timer').classList.add('show');}
function hideTimer(){document.getElementById('timer').classList.remove('show');}
function fmtTime(s){ s=Math.max(0,s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function paintTimer(){
  document.getElementById('timerTime').textContent=fmtTime(timer.rem);
  document.getElementById('timerLabel').textContent=timer.label||'Descanso';
  const el=document.getElementById('timerPause');
  if(el) el.textContent=timer.running?'Pausar':'Reanudar';
  document.getElementById('timer').classList.toggle('done',timer.rem<=0&&!timer.running);
}
function tick(){
  timer.rem=Math.max(0,Math.ceil((timer.end-Date.now())/1000));
  paintTimer();
  if(timer.rem<=0) finishTimer();
}
function finishTimer(){
  clearInterval(timer.id); timer.id=null; timer.running=false; timer.rem=0;
  beep();
  if(navigator.vibrate) navigator.vibrate([300,150,300,150,300]);
  paintTimer();
}
function startRest(sec,label){
  ensureAudio();
  clearInterval(timer.id);
  timer.end=Date.now()+sec*1000;
  timer.rem=sec;
  timer.running=true;
  timer.label=label||'Descanso';
  showTimer();
  paintTimer();
  timer.id=setInterval(tick,500);
  acquireWake();
}
function toggleTimer(){
  if(timer.running){ clearInterval(timer.id); timer.id=null; timer.running=false; }
  else if(timer.rem>0){ timer.end=Date.now()+timer.rem*1000; timer.running=true; timer.id=setInterval(tick,500); }
  paintTimer();
}
function adjustTimer(d){
  if(timer.running){ timer.end+=d*1000; tick(); return; }
  const wasDone=timer.rem<=0;
  timer.rem=Math.max(0,timer.rem+d);
  if(wasDone&&timer.rem>0){ startRest(timer.rem,timer.label); return; }
  paintTimer();
}
function closeTimer(){
  clearInterval(timer.id); timer.id=null; timer.running=false; timer.rem=0;
  hideTimer();
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h=setTimeout(()=>t.classList.remove('show'),3200);
}
document.addEventListener('pointerdown',()=>{ try{ensureAudio();}catch(e){} },{once:true});
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){
    if(timer.running) tick();
    if(state.settings.sid||timer.running) acquireWake();
  }
});
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  switchView(btn.dataset.view);
});

updateBadge();
switchView(state.next);
if(state.settings.sid) acquireWake();
</script>
